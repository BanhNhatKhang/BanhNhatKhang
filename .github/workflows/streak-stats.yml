name: Update GitHub Streak Stats

on:
  schedule:
    # 01:17 UTC = 08:17 tại Việt Nam
    # 13:17 UTC = 20:17 tại Việt Nam
    - cron: "17 1,13 * * *"

  push:
    paths:
      - ".github/workflows/streak-stats.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-streak:
    name: Generate streak SVG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate streak statistics
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=${{ github.repository_owner }}&theme=vue-dark&hide_border=true&border_radius=10"
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Commit updated streak SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "Streak SVG has no changes."
            exit 0
          fi

          git commit -m "chore: update GitHub streak stats"
          git push
