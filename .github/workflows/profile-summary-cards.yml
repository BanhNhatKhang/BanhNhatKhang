name: Generate GitHub Profile Cards

on:
  workflow_dispatch:
  schedule:
    # 00:15 UTC tương ứng 07:15 tại Việt Nam
    - cron: "15 0 * * *"

permissions:
  contents: write

jobs:
  generate-cards:
    name: Generate profile summary cards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub profile cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: BanhNhatKhang
          BRANCH_NAME: main
          UTC_OFFSET: 7
          AUTO_PUSH: true
          THEME: github_dark
          ANIMATION: none
          NAME: "Banh Nhat Khang"
